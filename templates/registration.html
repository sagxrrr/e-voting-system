<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Segoe UI, Tahoma, sans-serif;
background:linear-gradient(135deg,#fff3e0,#ffe0b2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* main box */

.container{
width:450px;
max-width: 90%;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
position: relative;
}

/* heading */

.container h2{
text-align:center;
color:#ff9800;
margin-bottom:20px;
}

/* form group */

.form-group{
margin-bottom:15px;
}

/* labels */

.form-group label{
display:block;
font-weight:600;
margin-bottom:5px;
color:#444;
}

/* icon input wrapper */

.input-box{
position:relative;
}

.input-box i{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
color:#ff9800;
}

.input-box input,
.input-box select{
width:100%;
padding:10px 10px 10px 35px;
border:1px solid #ddd;
border-radius:6px;
outline:none;
font-size:14px;
box-sizing: border-box;
}

/* focus effect */

.input-box input:focus,
.input-box select:focus{
border-color:#ff9800;
box-shadow:0 0 4px rgba(255,152,0,0.5);
}

/* button */

button{
width:100%;
padding:11px;
background:#ff9800;
border:none;
color:white;
font-size:15px;
border-radius:7px;
cursor:pointer;
margin-top:10px;
}

.back-btn{
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background: #ff9800;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    display: inline-block;
    width: auto;
}

button:hover{
background:#e68900;
}

/* bottom text */

.bottom-text{
text-align:center;
margin-top:12px;
font-size:14px;
}

.bottom-text a{
color:#ff9800;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<button class="back-btn" onclick="window.location.href='/'"
style="position:fixed;top:20px;left:20px;padding:10px 15px;
background:#ff9800;color:white;border:none;border-radius:6px;cursor:pointer;">
← Back
</button>

<div class="container">

<h2>User Registration</h2>

<form method="POST" action="/registration">

<div class="form-group">
<label>Full Name</label>
<div class="input-box">
<i class="fa fa-user"></i>
<input type="text" name="fullname" placeholder="Enter full name" required>
</div>
</div>

<div class="form-group">
<label>Email</label>
<div class="input-box">
<i class="fa fa-envelope"></i>
<input type="email" name="email" placeholder="Enter email" required>
</div>
</div>

<div class="form-group">
<label>Mobile</label>
<div class="input-box">
<i class="fa fa-phone"></i>
<input type="text" name="mobile" placeholder="Enter mobile number">
</div>
</div>

<div class="form-group">
<label>Gender</label>
<div class="input-box">
<i class="fa fa-venus-mars"></i>
<select name="gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>
</div>

<div class="form-group">
<label>Date of Birth</label>
<div class="input-box">
<i class="fa fa-calendar"></i>
<input type="date" name="dob">
</div>
</div>

<div class="form-group">
<label>Aadhar Number</label>
<div class="input-box">
<i class="fa fa-id-card"></i>
<input type="text" name="adhar_number" placeholder="Enter Aadhar number">
</div>
</div>

<div class="form-group">
<label>Voter ID</label>
<div class="input-box">
<i class="fa fa-vote-yea"></i>
<input type="text" name="voter_id" placeholder="Enter voter ID">
</div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" name="password" placeholder="Enter password" required>
</div>
</div>

<button type="submit">
<i class="fa fa-paper-plane"></i> Register
</button>

<div class="bottom-text">
Already registered? <a href="/user_login">Login here</a>
</div>

</form>

</div>

</body>
</html>
